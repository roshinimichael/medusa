name: Skyramp Testbot

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  issue_comment:
    types: [created]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.issue.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.actor != 'skyramp-testbot[bot]' }}

jobs:
  testbot:
    # Only run for pull_request events or issue_comment on PRs mentioning @skyramp-testbot
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request && contains(github.event.comment.body, '@skyramp-testbot') && github.event.comment.user.login != 'skyramp-testbot[bot]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      checks: write

    env:
      NODE_ENV: CI
      REDIS_URL: redis://localhost:6379
      DATABASE_URL: "postgres://postgres:postgres@localhost/medusa-test"
      NPM_CONFIG_LOGLEVEL: error
      NPM_CONFIG_AUDIT: false
      NPM_CONFIG_FUND: false
      NPM_CONFIG_UPDATE_NOTIFIER: false
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

    services:
      redis:
        image: redis
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 1s
          --health-timeout 10s
          --health-retries 10
        ports:
          - 6379:6379
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: medusa-test
        options: >-
          --health-cmd pg_isready
          --health-interval 1s
          --health-timeout 10s
          --health-retries 10
        ports:
          - 5432:5432

    steps:
      # Generate a GitHub App installation token to retrigger CI workflows on push
      # https://docs.github.com/en/apps/creating-github-apps/authenticating-with-a-github-app/making-authenticated-api-requests-with-a-github-app-in-a-github-actions-workflow
      - name: Generate GitHub App Token
        id: skyramp-testbot-app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.SKYRAMP_TESTBOT_APP_ID }}
          private-key: ${{ secrets.SKYRAMP_TESTBOT_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ steps.skyramp-testbot-app-token.outputs.token }}

      # SETUP — Node.js toolchain
      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.11.1

      # SETUP — build monorepo packages from PR source
      - name: Install and build monorepo dependencies
        uses: ./.github/actions/cache-deps
        with:
          extension: cli-database

      # SETUP — install Medusa CLI
      - name: Install Medusa CLI
        run: npm i -g @medusajs/cli@preview

      # SETUP — create a Medusa project that resolves @medusajs/* from the local monorepo build
      - name: Create Medusa project
        working-directory: ..
        run: |
          medusa new cli-test --skip-db --skip-migrations --branch ci-custom

      - name: Install project dependencies (resolves to local monorepo packages)
        run: rm -f pnpm-lock.yaml && pnpm install --prefer-frozen-lockfile=false
        working-directory: ../cli-test

      # SETUP — migrate DB and seed test user
      - name: Run database migrations
        run: npx medusa db:migrate
        working-directory: ../cli-test/apps/backend

      - name: Create admin user
        run: npx medusa user -e test@test.com -p password -i admin_123
        working-directory: ../cli-test/apps/backend

      # SETUP — start the server in the background; Testbot will wait for /health
      - name: Start Medusa server
        run: npx medusa start &
        working-directory: ../cli-test/apps/backend

      - uses: skyramp/testbot@eval-sut # v0.10.3
        with:
          skyrampLicenseFile: ${{ secrets.SKYRAMP_LICENSE_FILE }}
          anthropicApiKey: ${{ secrets.SKYRAMP_TESTBOT_API_KEY }}
          githubToken: ${{ steps.skyramp-testbot-app-token.outputs.token }}
          skyrampMcpVersion: next
          sutSetupMode: 'none'
          skipTargetSetup: 'true'
          targetReadyCheckCommand: 'curl -sf http://localhost:9000/health'
          targetReadyCheckTimeout: '180'
          authTokenCommand: 'bash .skyramp/sut/get-auth-token.sh'

      # TEARDOWN — stop Medusa server so each run starts clean
      - name: Stop Medusa server
        if: always()
        run: kill -9 $(lsof -t -i :9000) || true
