# Lightweight Medusa stack for Skyramp Testbot CI.
# Postgres is the only hard dependency; the Medusa server is bootstrapped
# via the CLI at container startup so no pre-built image is required.

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: medusa
      POSTGRES_PASSWORD: medusa
      POSTGRES_DB: medusa
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medusa"]
      interval: 5s
      timeout: 5s
      retries: 10

  medusa:
    build:
      context: .
      dockerfile: Dockerfile.testbot
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://medusa:medusa@postgres/medusa
      JWT_SECRET: testbot-jwt-secret
      COOKIE_SECRET: testbot-cookie-secret
      NODE_ENV: development
      STORE_CORS: "http://localhost:3000"
      ADMIN_CORS: "http://localhost:9000"
    ports:
      - "9000:9000"
