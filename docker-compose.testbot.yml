# Skyramp Testbot test environment — two services:
#
#   postgres  — standard Postgres 15, health-checked before Medusa starts.
#   medusa    — bootstrapped at container start from a vanilla `medusa new`
#               project. The PR's source tree is mounted read-only at /repo so
#               the new route file can be copied in before the server starts.
#               Run via `docker compose up -d --force-recreate` to guarantee a
#               clean container on every testbot run (no cached state).

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: medusa
      POSTGRES_PASSWORD: medusa
      POSTGRES_DB: medusa
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medusa"]
      interval: 5s
      timeout: 5s
      retries: 10

  medusa:
    image: node:20-alpine
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/repo:ro
    environment:
      DATABASE_URL: postgres://medusa:medusa@postgres/medusa?sslmode=disable
      JWT_SECRET: testbot-jwt-secret
      COOKIE_SECRET: testbot-cookie-secret
      NODE_ENV: development
      STORE_CORS: "http://localhost:3000"
      ADMIN_CORS: "http://localhost:9000"
    ports:
      - "9000:9000"
    command: >-
      sh -c "
        apk add --no-cache curl git &&
        npm install -g @medusajs/cli@preview pnpm --quiet &&
        medusa new /testbot-app --skip-db --skip-migrations &&
        mkdir -p /testbot-app/apps/backend/src/api/ping &&
        cp /repo/packages/medusa/src/api/ping/route.ts /testbot-app/apps/backend/src/api/ping/route.ts &&
        cd /testbot-app/apps/backend &&
        npx medusa db:migrate &&
        npx medusa user -e admin@testbot.com -p supersecret &&
        npx medusa start
      "
