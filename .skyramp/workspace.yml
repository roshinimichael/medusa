# Skyramp Workspace Configuration
workspace:
  repoName: roshinimichael/medusa
  repoUrl: git@github.com:roshinimichael/medusa.git
metadata:
  schemaVersion: v1
  mcpVersion: 0.1.0
  executorVersion: v1.3.22
  createdAt: "2026-04-30T00:10:50.084Z"
  updatedAt: "2026-04-30T00:10:50.091Z"
services:
  - serviceName: medusa-api
    language: typescript
    framework: playwright
    testDirectory: tests/skyramp/api
    api:
      authType: bearer
      authHeader: Authorization
      authScheme: Bearer
      baseUrl: http://localhost:9000
    runtimeDetails:
      serverStartCommand: docker compose -f docker-compose.testbot.yml up -d
      runtime: docker
  - serviceName: admin-dashboard
    language: typescript
    framework: playwright
    testDirectory: tests/skyramp/admin
    api:
      authType: bearer
      authHeader: Authorization
      authScheme: Bearer
      baseUrl: http://localhost:9000/app
    runtimeDetails:
      serverStartCommand: docker compose -f docker-compose.testbot.yml up -d
      runtime: docker
